name: Offline capture replay tests
on:
  push:
    branches: [main, feature/unified-capture-mitm-replay]
  pull_request:
    paths:
      - capture_replay.py
      - run_capture_proxy.py
      - record_site.py
      - tests/test_capture_replay.py
      - tests/test_action_settling.py
      - tests/test_recorded_js_sources.py
      - tests/test_js_dom_fixture.py
      - gym/fixtures/js-demo/**
      - automatic_capture.py
      - navigation_analysis.py
      - .github/workflows/offline-capture-tests.yml
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sanitized snapshot replay
        run: python -m unittest discover -s tests -p "test_*.py" -v
