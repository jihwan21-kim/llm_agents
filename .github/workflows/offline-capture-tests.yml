name: Offline capture replay tests
on:
  push:
    branches: [main, feature/unified-capture-mitm-replay]
  pull_request:
    paths:
      - capture_replay.py
      - fidelity_audit.py
      - tests/test_fidelity_audit.py
      - run_capture_proxy.py
      - record_site.py
      - tests/test_capture_replay.py
      - tests/test_trusted_fixture_replay.py
      - gym/build_js_fixture_recording.py
      - tests/test_action_settling.py
      - tests/test_recorded_js_sources.py
      - tests/test_agent_js_source_inspection.py
      - export_recorded_js_for_devtools.py
      - export-devtools-js-windows.bat
      - tests/test_devtools_js_export.py
      - gym/DEVTOOLS_JS_WORKSPACE.md
      - gym/AGENT_JS_INSPECTION.md
      - start-har-mock-windows.bat
      - tests/test_js_dom_fixture.py
      - tests/test_fixture_receipt.py
      - gym/fixture_receipt.py
      - gym/fixtures/js-demo/**
      - gym/functional_sites.py
      - gym/site_access_policy.json
      - gym/site_access_policy.py
      - tests/test_site_access_policy.py
      - gym/SITE_ACCESS_POLICY.md
      - start-policy-har-mock-windows.bat
      - gym/fixtures/study-board/**
      - gym/FUNCTIONAL_REPLAY.md
      - run_functional_gym.py
      - start-functional-gym-windows.bat
      - tests/test_functional_gym.py
      - gym/build_approved_mock.py
      - generate-site-mock-windows.bat
      - tests/test_approved_mock_generator.py
      - gym/FUNCTIONAL_REPLAY.md
      - automatic_capture.py
      - navigation_analysis.py
      - .github/workflows/offline-capture-tests.yml
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sanitized snapshots and functional fixtures
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check functional site JavaScript syntax
        run: |
          node --check gym/fixtures/js-demo/app.js
          node --check gym/fixtures/study-board/app.js
